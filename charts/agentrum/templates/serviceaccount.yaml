apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentrum.fullname" . }}
  labels:
    app.kubernetes.io/name: agentrum
{{- if .Values.deploy.imageAllowlist }}
---
# Least-privilege RBAC for the deployment controller: workloads management
# limited to the controller's own namespace (extend watchedNamespaces later).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentrum.fullname" . }}-deploy
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentrum.fullname" . }}-deploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentrum.fullname" . }}-deploy
subjects:
  - kind: ServiceAccount
    name: {{ include "agentrum.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
