apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentrum.fullname" . }}
  labels:
    app.kubernetes.io/name: agentrum
stringData:
  AGENT_REGISTRY_DATABASE_URL: {{ include "agentrum.databaseUrl" . | quote }}
  ARK_SECRET_KEY: {{ .Values.auth.secretKey | default "CHANGE-ME" | quote }}
  ARK_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.auth.bootstrapAdminPassword | default "CHANGE-ME" | quote }}
  {{- if .Values.secrets.encryptionKey }}
  ARK_SECRET_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
