apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentrum.fullname" . }}
  labels:
    app.kubernetes.io/name: agentrum
stringData:
  {{- if not .Values.database.existingSecret }}
  ARK_DATABASE_URL: {{ required "database.url is required (or set database.existingSecret)" .Values.database.url | quote }}
  {{- end }}
  {{- if not .Values.auth.existingSecret }}
  ARK_SECRET_KEY: {{ required "auth.secretKey is required (or set auth.existingSecret)" .Values.auth.secretKey | quote }}
  {{- end }}
  ARK_BOOTSTRAP_ADMIN_PASSWORD: {{ required "auth.bootstrapAdminPassword is required" .Values.auth.bootstrapAdminPassword | quote }}
  {{- if not .Values.secrets.existingSecret }}
  ARK_SECRET_ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required (or set secrets.existingSecret)" .Values.secrets.encryptionKey | quote }}
  {{- end }}
