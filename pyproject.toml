[project]
name = "agentrum"
version = "0.0.1"
description = "Agentrum — multi-tenant registry for AI agents, MCP servers, skills and prompts. Publish, subscribe, run."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Agentrum Contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "httpx>=0.28.0",
    "dulwich>=0.22.0",
    "mcp>=1.9.0",
    "typer>=0.12.5",
    "pyyaml>=6.0.2",
    "authlib>=1.4.0",
    "cryptography>=43.0.0",
    "kubernetes-asyncio>=31.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.scripts]
agentrum = "agentrum.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "dulwich>=0.22.0",
    "mcp>=1.9.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrum"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# B008: `Depends(...)` in argument defaults is the canonical FastAPI idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
