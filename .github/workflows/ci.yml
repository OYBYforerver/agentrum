name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentrum
          POSTGRES_PASSWORD: agentrum
          POSTGRES_DB: agentrum_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agentrum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ARK_DATABASE_URL: postgresql+asyncpg://agentrum:agentrum@localhost:5433/agentrum_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Unit tests
        run: uv run pytest -q
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Integration tests
        run: uv run pytest tests/integration -q
        env:
          ARK_INTEGRATION: "1"

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t agentrum/server:${{ github.sha }} .
      - name: Install Helm (pinned)
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Validate Helm chart
        run: |
          helm lint charts/agentrum \
            --set database.url="postgresql+asyncpg://u:p@h:5432/agentrum" \
            --set auth.secretKey=ci --set auth.bootstrapAdminPassword=ci \
            --set secrets.encryptionKey=ci
          helm template ci charts/agentrum \
            --set database.url="postgresql+asyncpg://u:p@h:5432/agentrum" \
            --set auth.secretKey=ci --set auth.bootstrapAdminPassword=ci \
            --set secrets.encryptionKey=ci >/dev/null

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material[imaging]==9.8.0" "mkdocs-static-i18n==1.3.1"
      - run: mkdocs gh-deploy --force
