site_name: Agentrum
site_description: Multi-tenant registry for AI agents, MCP servers, skills and prompts
repo_url: https://github.com/OYBYforerver/agentrum

docs_dir: docs/site
site_dir: .docs-build

theme:
  name: material
  language: zh
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 浅色
  features: [navigation.tabs, navigation.sections, content.code.copy]

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true

nav:
  - 首页: index.md
  - 接入指南:
      - 快速开始: quickstart.md
      - CLI 参考: cli.md
      - API 参考: api.md
      - 资源规范(agentrum.yaml): resources.md
      - 订阅与通知: subscribe.md
      - 部署接入(K8s): deploy.md
      - IDE 接入(MCP): ide.md
  - 管理与运维:
      - 架构: architecture.md
      - 权限模型: permissions.md
      - SSO 接入(管理员): sso.md
      - 运维手册: operations.md
  - 路线图: roadmap.md
